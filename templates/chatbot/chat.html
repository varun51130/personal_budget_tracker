{% extends 'base.html' %}
{% block content %}
<div class="card" style="padding:16px; max-width:600px; margin:auto;">
  <h2>Chatbot (Ask about your budget)</h2>

  <div id="chatLog" style="height:300px; overflow:auto; border:1px solid #eee; padding:8px; margin-bottom:8px"></div>
  <form id="chatForm">
    <input id="msg" placeholder="Ask something about your spending..." style="width:80%" />
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById('chatForm');
    const log = document.getElementById('chatLog');

    function append(text){
      const p = document.createElement('div');
      p.textContent = text;
      log.appendChild(p);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      const m = document.getElementById('msg').value;
      if (!m) return;
      append('You: ' + m);
      document.getElementById('msg').value = '';
      append('Bot: ...');

      try {
        const res = await fetch('{% url "chatbot:chat_api" %}', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({message: m})
        });
        const j = await res.json();

        if (j.reply) {
          log.lastChild.textContent = 'Bot: ' + j.reply;
        } else {
          log.lastChild.textContent = 'Bot: Error: ' + (j.error || 'no reply');
        }
      } catch(err) {
        log.lastChild.textContent = 'Bot: Error contacting server';
        console.error(err);
      }
    });
  </script>
</div>
{% endblock %}
