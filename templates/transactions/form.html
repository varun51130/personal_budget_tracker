{% extends 'base.html' %}
{% block content %}
<div class="card">
  <h2>{{ action }} Transaction</h2>
  {% if confirm_delete %}
    <p>Are you sure you want to delete transaction {{ transaction }}?</p>
    <form method="post">{% csrf_token %}<button type="submit">Confirm Delete</button></form>
  {% else %}
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{{ action }}</button>
  </form>
  {% endif %}
</div>
{% endblock %}
